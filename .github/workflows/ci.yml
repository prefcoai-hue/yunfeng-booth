name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check site files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -euo pipefail
          test -f index.html
          test -f README.md
          test -f Dockerfile

      - name: index.html must include booth title
        run: |
          grep -q "Yunfeng Booth" index.html
          grep -q "雲峰展位" index.html
